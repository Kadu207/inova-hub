name: inovahub

services:
  postgres:
    container_name: inovahub-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: inova_hub
      POSTGRES_USER: inova
      POSTGRES_PASSWORD: inova_secret_change_me
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inova -d inova_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: inovahub-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6392:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    container_name: inovahub-app
    build:
      context: ./app
      dockerfile: ../infra/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "127.0.0.1:8092:80"
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    volumes:
      - ./app:/var/www/html
      - ./infra/entrypoint.sh:/entrypoint.sh:ro
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8092
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: inova_hub
      DB_USERNAME: inova
      DB_PASSWORD: inova_secret_change_me
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    name: inovahub_postgres_data
